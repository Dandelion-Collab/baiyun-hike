services:
  api:
    build: .
    image: gz-travel-assistant:latest
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./docs:/app/docs
      - ./logs:/app/logs
    env_file: .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  ui:
    build: .
    image: gz-travel-assistant:latest
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
      - ./docs:/app/docs
      - ./logs:/app/logs
    env_file: .env
    environment:
      STREAMLIT_SERVER_ADDRESS: 0.0.0.0
      STREAMLIT_SERVER_PORT: "8501"
      STREAMLIT_SERVER_HEADLESS: "true"
    command: ["streamlit", "run", "app_ui.py", "--server.address=0.0.0.0", "--server.port=8501", "--server.headless=true"]
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

# ui 依赖 api 的接口时用 http://api:8000（同一 compose 网络里的服务名）